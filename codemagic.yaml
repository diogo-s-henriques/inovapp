# Release da INOVAPP no Codemagic — a mesma receita do Campus Buddy, e pela mesma razão.
#
# ## Porque é que assina o EAS e não a Codemagic
#
# O build é `eas build --local`: corre o processo todo do EAS (prebuild, CocoaPods, Gradle,
# xcodebuild) na máquina da Codemagic, mas **as credenciais continuam a ser do EAS** e são
# descarregadas no arranque. Isso é o que faz este ficheiro ser curto:
#
# - a **keystore de upload** do Android é a que a Google Play já conhece. Não se exporta, não se
#   carrega aqui, e não se corre o risco de gerar uma nova (uma keystore diferente só entra depois de
#   um *reset* da upload key na Play Console, com 72 h de espera impostas pela Google);
# - o **certificado de distribuição e o perfil App Store** do iOS são os que estão no EAS e que a
#   app publicada já usou. Não se gera um segundo certificado (a Apple limita-os a três).
#
# A alternativa - a Codemagic tratar da assinatura com ficheiros carregados à mão - foi escrita e
# descartada: pedia uma keystore exportada, uma chave privada gerada e duas integrações ligadas para
# chegar ao mesmo sítio, com mais sítios onde falhar. O `--local` não gasta quota do EAS (o único
# contacto com os servidores é confirmar que o projeto existe e descarregar as credenciais) e gasta
# minutos da Codemagic, que é exactamente o que a Codemagic serve para dar.
#
# ## Antes de correr, no painel da Codemagic
#
# Um grupo de variáveis de ambiente chamado `inovapp` com:
#
#   EXPO_TOKEN   (expo.dev/settings/access-tokens)  — marcado como Secret
#
# Só isto. As credenciais de assinatura *e* as de publicação (a chave da App Store Connect e a conta
# de serviço da Play) vivem no EAS, e é por `EXPO_TOKEN` que o `eas submit` chega a elas.
#
# ## Como se usa
#
# Os workflows não têm `triggering`: uma build de loja é um ato deliberado, não um efeito de gravar
# um ficheiro. Start new build → branch `main` → `ios-release` (.ipa + TestFlight) ou
# `android-release` (.aab + rascunho na Play).
#
# ## As versões
#
# Vêm do `app.json` (`1.0.1`, iOS build 12, Android versionCode 11) e o `eas.json` está em
# `appVersionSource: local`. **Sobe o número da loja antes de cada envio**: nem o EAS nem a Codemagic
# inventam um número por ti, e um `versionCode` repetido é recusado na Play sem apagar nada.

workflows:
  ios-release:
    name: INOVAPP · iOS (.ipa + TestFlight)
    # A M2 é a máquina incluída no plano gratuito (a M4 exige faturação ativa), e o macOS é
    # obrigatório: o `--local` para iOS precisa de Xcode.
    instance_type: mac_mini_m2
    # Uma build local não tem cache nenhuma do lado do EAS, e o pod install do RNFB é lento.
    max_build_duration: 120

    environment:
      groups:
        - inovapp
      # A mesma versão em que o projeto é desenvolvido (ver o fluxo de testes).
      node: 24
      # O SDK 57 assenta no iOS 26 e a Apple recusa uploads feitos com Xcode anterior; a imagem da
      # Codemagic traz este por omissão, e o passo "Verificar Xcode" falha cedo se ele mudar.
      xcode: 26.6

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/node_modules

    scripts:
      # Falhar aqui, com uma mensagem que diz o que fazer, é melhor do que falhar a meio da
      # compilação por causa de um segredo que não existe.
      - name: Verificar segredos
        script: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Falta EXPO_TOKEN no grupo inovapp."
            echo "Cria um em https://expo.dev/settings/access-tokens e adiciona-o em"
            echo "Codemagic > Environment variables > grupo inovapp (marcado como Secret)."
            exit 1
          fi

      - name: Ferramentas disponíveis
        script: |
          node -v
          npm -v
          xcodebuild -version
          pod --version

      - name: Verificar Xcode 26+
        script: |
          XCODE_MAJOR=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "Xcode $XCODE_MAJOR detetado, mas o SDK 57 exige Xcode 26+."
            exit 1
          fi
          echo "Xcode major $XCODE_MAJOR OK"

      # **Este passo não é opcional.** O `eas` resolve os plugins do `app.json` (o do RNFB, o do
      # `expo-splash-screen`, ...) antes de compilar, e essa resolução segue os `require` dos
      # plugins - que vivem no `node_modules`. Sem ele, a build local morre em segundos com uma
      # mensagem que nem menciona dependências:
      #
      #   Failed to resolve plugin for module "@react-native-firebase/app" relative to ...
      #
      # Nos servidores do EAS não se nota, porque lá as dependências são instaladas na cópia do
      # projeto que a build recebe.
      - name: Instalar dependências
        script: npm ci

      # O `eas-cli` não é dependência do projeto - é uma ferramenta que se corre, não uma peça que
      # se empacota.
      - name: Instalar o eas-cli
        script: npm install --global eas-cli

      # As duas ferramentas que a documentação exige para uma build local de iOS. A imagem da
      # Codemagic já as traz; o passo existe para o caso de isso mudar, e para se ver no registo
      # quais as versões que compilaram de facto.
      - name: Garantir fastlane e CocoaPods
        script: |
          command -v fastlane >/dev/null || sudo gem install fastlane -N || brew install fastlane
          command -v pod >/dev/null || brew install cocoapods
          fastlane --version | head -1
          pod --version

      # `set -o pipefail` não é decorativo: sem ele, o código de saída deste passo era o do `tee`,
      # que é sempre 0 - e uma build falhada seguia para a submissão como se tivesse corrido bem.
      - name: Compilar para a loja (EAS local)
        script: |
          set -o pipefail
          mkdir -p artifacts
          # Cada bloco de scripts corre numa shell nova, por isso os `export` ficam dentro do passo.
          export EAS_LOCAL_BUILD_ARTIFACTS_DIR="$CM_BUILD_DIR/artifacts"
          # Não apagar o diretório de trabalho no fim: é o que permite ler os registos do Xcode se
          # alguma coisa correr mal (ficam em `logs/`, lá dentro).
          export EAS_LOCAL_BUILD_SKIP_CLEANUP=1
          eas build --local --non-interactive --profile production --platform ios 2>&1 \
            | tee artifacts/build.log

      # Submeter daqui e não da máquina de quem desenvolve: o `.ipa` não anda de mão em mão, e a
      # chave da App Store Connect que o EAS já tem é usada onde ela está. O upload cai no
      # TestFlight; publicar na App Store continua a exigir passar por App Review, na consola.
      - name: Submeter ao App Store Connect
        script: |
          IPA=$(ls artifacts/*.ipa | head -1)
          ls -lh "$IPA"
          eas submit --platform ios --profile production --non-interactive --path "$IPA"

    artifacts:
      - artifacts/*.ipa
      # Só interessa quando algo corre mal, e é o que se pede no primeiro comentário de um erro.
      - artifacts/build.log

  android-release:
    name: INOVAPP · Android (.aab + rascunho na Play)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      groups:
        - inovapp
      node: 24
      # O SDK 57 exige JDK 17 para o Gradle; com versões mais recentes falha.
      java: 17

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $CM_BUILD_DIR/node_modules

    scripts:
      - name: Verificar segredos
        script: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Falta EXPO_TOKEN no grupo inovapp."
            exit 1
          fi

      - name: Ferramentas disponíveis
        script: |
          node -v
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Instalar dependências
        script: npm ci

      - name: Instalar o eas-cli
        script: npm install --global eas-cli

      - name: Compilar para a loja (EAS local)
        script: |
          set -o pipefail
          mkdir -p artifacts
          export EAS_LOCAL_BUILD_ARTIFACTS_DIR="$CM_BUILD_DIR/artifacts"
          export EAS_LOCAL_BUILD_SKIP_CLEANUP=1
          eas build --local --non-interactive --profile production --platform android 2>&1 \
            | tee artifacts/build.log

      # O `eas.json` pede `releaseStatus: draft`: o `.aab` entra no *track* de produção como
      # rascunho, à espera de um "Iniciar lançamento" a sério, feito por uma pessoa.
      #
      # A conta de serviço da Play vive no EAS (a do `firebase-adminsdk-fbsvc@…`), por isso não há
      # aqui credencial nenhuma - mas **tem de estar convidada na Play Console** (Utilizadores e
      # permissões → Lançar para faixas de teste + Lançar para produção). Enquanto não estiver, este
      # passo é o único que falha, e falha no fim: o `.aab` já está nos artefactos.
      - name: Submeter à Google Play (rascunho)
        script: |
          AAB=$(ls artifacts/*.aab | head -1)
          ls -lh "$AAB"
          eas submit --platform android --profile production --non-interactive --path "$AAB"

    artifacts:
      - artifacts/*.aab
      - artifacts/build.log
