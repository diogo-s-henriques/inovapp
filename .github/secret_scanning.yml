# As chaves de API do Firebase que vivem nestes ficheiros não são segredos. As chaves de API do
# Firebase são públicas por desenho - identificam o projeto, não autorizam nada (quem autoriza são as
# regras do Firestore e o App Check) - e viajam dentro de cada app instalada: a Android no APK, a iOS
# no IPA. O próprio Google as considera seguras de guardar no repositório, desde que restringidas às
# APIs do Firebase.
#
# O `eas.json` entrou nesta lista por uma razão diferente e mais prática: as builds do EAS **não veem
# o `.env`** (está no .gitignore, portanto não sobe para o construtor), e sem estas seis variáveis no
# perfil o bundle sai sem configuração e a app fecha no arranque - foi assim que a revisão da Apple
# recusou a 1.0 (6). A configuração do Firebase é o caso que a própria documentação do EAS descreve
# para o campo `env`: "valores que committerias ao repositório".
#
# A razão por inteiro está no README, em "A chave de API do Firebase está no repositório, e é para
# estar". Este ficheiro fecha o alerta e a push protection para estes caminhos, em vez de se rodar
# uma chave que não é secreta e que está dentro de todas as apps já instaladas.
paths-ignore:
  - "google-services.json"
  - "GoogleService-Info.plist"
  - "eas.json"
