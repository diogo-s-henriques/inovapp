# A chave de API do Firebase que vive em google-services.json não é um segredo. As chaves de API do
# Firebase são públicas por desenho - identificam o projeto, não autorizam nada (quem autoriza são as
# regras do Firestore e o App Check) - e viajam dentro de cada APK. O próprio Google as considera
# seguras de guardar no repositório, desde que restringidas às APIs do Firebase.
#
# A razão por inteiro está no README, em "A chave de API do Firebase está no repositório, e é para
# estar". Este ficheiro fecha o alerta e a push protection para este caminho, em vez de se rodar uma
# chave que não é secreta e que está dentro de todas as apps já instaladas.
paths-ignore:
  - "google-services.json"
